[project]
name = "langgraph-sherlock"
version = "0.1.0"
description = "Parallel LangGraph implementation of the Sherlock integration recon agent"
requires-python = ">=3.12"
dependencies = [
  "langchain[mcp]>=1.4.0",
  "langchain-openai>=1.1.0",
  "langgraph>=1.0.0",
  "pydantic-settings>=2.10.0",
  "a2a-sdk[http-server]>=1.0.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.2.0"]

[project.scripts]
sherlock = "sherlock.cli:main"
sherlock-a2a = "sherlock.a2a_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.0",
]
